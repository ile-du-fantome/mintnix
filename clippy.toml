# Allow functions to have at most 15 parameters (default: 8)
too-many-arguments-threshold = 15

# Apply doc lints (missing_safety_doc, missing_errors_doc, etc.) to private items (default: false)
check-private-items = true

# Allow unwrap in tests (default: false)
allow-unwrap-in-tests = true

# Allow unwrap in compile-time code (default: true)
allow-unwrap-in-consts = true

# Allow expect in tests (default: false)
allow-expect-in-tests = true

# Allow expect in consts (default: true)
allow-expect-in-consts = true

# Allow panic in tests (default: false)
allow-panic-in-tests = true

# Allow index slicing in tests (default: false)
allow-indexing-slicing-in-tests = true

# Project vocabulary that doc_markdown should not flag as missing backticks.
doc-valid-idents = ["mintnix"]
